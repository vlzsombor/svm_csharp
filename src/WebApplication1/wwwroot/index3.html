<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<canvas id="canvas" style="border: 1px solid red; filter: grayscale(1);image-rendering:pixelated;"></canvas>
<h1>Canvas show:</h1>
<canvas id="canvasShow" width="28" height="28" style="border: 1px solid red;width:280px; filter: grayscale(1);image-rendering:pixelated;"></canvas>
</body>
<script src="js/fabric.min.js"></script>

<button onclick="sendRequest()">Senden</button>
<script>
    var canvas = new fabric.Canvas('canvas', { width: 28, height: 28 });
    canvas.isDrawingMode = true;
    canvas.freeDrawingBrush.width = 1;
    canvas.freeDrawingBrush.color = "#ffffff";
    canvas.backgroundColor = "#000000";
    canvas.renderAll();


    async function sendRequest()
    {
        // Fabric.js-Canvas als natives Canvas exportieren

        canvas.renderAll();
        var nativeCanvas = document.getElementById('canvas');
        var canvasContext = nativeCanvas.getContext("2d", {willReadFrequently: true});

        canvas.renderAll();
        const imageData = canvasContext.getImageData(0, 0, nativeCanvas.width, nativeCanvas.height);

        var canvasShow = document.getElementById('canvasShow');
        var ctxShow = canvasShow.getContext('2d');

        ctxShow.putImageData(imageData, 0, 0);
    } 
    async function sendRequest2()
    {
        var canvasContext = canvas.getContext("2d", {willReadFrequently: true})
        const imageData = canvasContext.getImageData(0, 0, canvas.width, canvas.height);
        
//        const response = await fetch('/svm', {
//            method: 'POST',
//            headers: { 'Content-Type': 'application/json' },
//            body: JSON.stringify(imageData.data.toString())
//        });
//        
//        console.log(await response.text())









        var canvasShow = document.getElementById('canvasShow');
        var ctxShow = canvasShow.getContext('2d');


        //var imageDataShow = ctxShow.getImageData(0, 0, canvasShow.width, canvasShow.height);
        var imageDataShow = ctxShow.createImageData(canvas.width, canvas.height);
        var dataShow = imageDataShow.data;

        for(let i = 0; i < dataShow.length; i++) {
            dataShow[i] = imageData[i];
        }
        ctxShow.putImageData(imageData, 0, 0);
    }
</script>
</html>
